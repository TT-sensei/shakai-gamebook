<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>米づくりゲームブック ― きみの選択で一年が変わる</title>
<style>
  :root{
    --paper:#EEF2E9;
    --paper-2:#E4EADC;
    --ink:#263229;
    --ink-soft:#4C5A4E;
    --paddy:#4E7C4A;
    --paddy-dark:#3A5F3A;
    --water:#4C7A93;
    --gold:#C89B3C;
    --brown:#8B6B4A;
    --warn:#B65C38;
    --card-shadow: 0 2px 10px rgba(38,50,41,0.10);
    --stage-color: var(--paddy);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,-apple-system,sans-serif;
    display:flex;
    justify-content:center;
    -webkit-tap-highlight-color:transparent;
  }
  #app{
    width:100%;
    max-width:560px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--paper);
  }

  /* ---------- header ---------- */
  .stagebar{
    padding:14px 18px 12px;
    background:var(--stage-color);
    color:#fff;
    transition:background .4s ease;
  }
  .stagebar .row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
  }
  .stagebar .season{
    font-size:22px;
    font-weight:700;
    letter-spacing:.04em;
  }
  .stagebar .month{
    font-size:13px;
    opacity:.9;
  }
  .dots{
    margin-top:10px;
    display:flex;
    gap:6px;
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    background:rgba(255,255,255,.35);
  }
  .dot.done{background:#fff;}
  .dot.now{background:#fff; transform:scale(1.3);}

  /* ---------- main scene area ---------- */
  main{
    flex:1;
    display:flex;
    flex-direction:column;
    padding:20px 18px 18px;
    gap:14px;
  }
  .scene-card{
    background:#fff;
    border-radius:16px;
    padding:20px 18px;
    box-shadow:var(--card-shadow);
  }
  .scene-title{
    font-size:15px;
    font-weight:700;
    color:var(--paddy-dark);
    margin:0 0 8px;
  }
  .scene-text{
    font-size:18px;
    line-height:1.85;
    margin:0;
    white-space:pre-wrap;
  }

  .choices{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-top:auto;
  }
  .choice-btn{
    display:block;
    width:100%;
    text-align:left;
    padding:18px 18px;
    font-size:17px;
    line-height:1.5;
    font-family:inherit;
    color:var(--ink);
    background:#fff;
    border:2px solid var(--paper-2);
    border-radius:14px;
    cursor:pointer;
    transition:border-color .15s ease, transform .1s ease;
  }
  .choice-btn:active{
    transform:scale(0.98);
  }
  .choice-btn:hover{
    border-color:var(--paddy);
  }
  .choice-btn .num{
    display:inline-block;
    width:26px;height:26px;
    line-height:26px;
    text-align:center;
    border-radius:50%;
    background:var(--paddy);
    color:#fff;
    font-size:13px;
    font-weight:700;
    margin-right:10px;
  }

  /* ---------- result panel ---------- */
  .result-card{
    background:#fff;
    border-radius:16px;
    padding:20px 18px;
    box-shadow:var(--card-shadow);
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .result-block h3{
    margin:0 0 4px;
    font-size:13px;
    color:var(--ink-soft);
    font-weight:700;
  }
  .result-block p{
    margin:0;
    font-size:16px;
    line-height:1.75;
  }
  .point-block{
    background:var(--paper-2);
    border-radius:12px;
    padding:14px 16px;
  }
  .point-block h3{
    color:var(--paddy-dark);
    margin:0 0 6px;
    font-size:14px;
    font-weight:700;
  }
  .fact-block{
    border-left:4px solid var(--gold);
    padding-left:12px;
  }
  .fact-block p{color:var(--ink-soft); font-size:14.5px;}

  .next-btn{
    margin-top:4px;
    align-self:stretch;
    padding:16px;
    border:none;
    border-radius:14px;
    background:var(--paddy-dark);
    color:#fff;
    font-size:17px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
  }
  .next-btn:active{transform:scale(0.98);}

  /* ---------- title / resume screen ---------- */
  .center-screen{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 24px;
    text-align:center;
    gap:22px;
  }
  .title-emblem{
    font-size:46px;
  }
  .title-jp{
    font-size:26px;
    font-weight:700;
    color:var(--paddy-dark);
    margin:0;
  }
  .title-sub{
    font-size:14px;
    color:var(--ink-soft);
    margin:0;
    line-height:1.7;
  }
  .primary-btn{
    width:100%;
    max-width:320px;
    padding:18px;
    border:none;
    border-radius:14px;
    background:var(--paddy-dark);
    color:#fff;
    font-size:17px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
  }
  .ghost-btn{
    width:100%;
    max-width:320px;
    padding:16px;
    border:2px solid var(--paper-2);
    border-radius:14px;
    background:transparent;
    color:var(--ink-soft);
    font-size:15px;
    font-family:inherit;
    cursor:pointer;
  }

  /* ---------- ending ---------- */
  .badge{
    display:inline-block;
    padding:8px 18px;
    border-radius:999px;
    background:var(--gold);
    color:#fff;
    font-weight:700;
    font-size:14px;
    margin-bottom:6px;
  }
  .log-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin:14px 0;
  }
  .log-item{
    background:var(--paper-2);
    border-radius:12px;
    padding:12px 14px;
    font-size:14.5px;
    line-height:1.6;
  }
  .log-item .tag{
    font-size:12px;
    color:var(--paddy-dark);
    font-weight:700;
    display:block;
    margin-bottom:2px;
  }
  .learn-grid{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:10px 0 4px;
  }
  .learn-chip{
    font-size:12.5px;
    background:#fff;
    border:1.5px solid var(--paddy);
    color:var(--paddy-dark);
    padding:6px 10px;
    border-radius:999px;
  }
  .reflect-q{
    font-size:15px;
    font-weight:700;
    margin:16px 0 6px;
  }
  textarea.reflect{
    width:100%;
    min-height:70px;
    border:2px solid var(--paper-2);
    border-radius:12px;
    padding:12px;
    font-family:inherit;
    font-size:15px;
    resize:vertical;
  }
  footer.note{
    padding:10px 18px 22px;
    font-size:12px;
    color:var(--ink-soft);
    text-align:center;
  }
</style>
</head>
<body>

/* =========================================================
   ゲームエンジン
   ========================================================= */
const SAVE_KEY = "komezukuri_save_v1";

function weightedPick(pool, n){
  // 重み付き非復元抽出（Math.random()^(1/weight) トリック）
  const scored = pool.map(e => ({e, score: Math.pow(Math.random(), 1/e.weight)}));
  scored.sort((a,b)=>b.score-a.score);
  return scored.slice(0,n).map(s=>s.e);
}

function buildTimeline(){
  const targetEventCount = 2 + Math.floor(Math.random()*3); // 2〜4
  const chosen = weightedPick(EVENTS, Math.min(targetEventCount, EVENTS.length));

  const timeline = [];
  STAGE_ORDER.forEach(stageKey=>{
    const req = CORE_SCENES[stageKey].map(s=>({...s, kind:"core", stage:stageKey}));
    const evs = chosen
      .filter(e=>e.stages.includes(stageKey))
      .map(e=>({
        id:e.id+"_"+stageKey, kind:"event", stage:stageKey,
        title:e.title, text:e.text, choices:e.choices,
        requiredLearning:e.requiredLearning, educationalIntent:e.educationalIntent,
        eventName:e.name
      }));
    // イベントを必須シーンの合間に均等に差し込む
    const merged = [];
    const gap = evs.length>0 ? Math.max(1, Math.floor(req.length/(evs.length+1))) : 0;
    let ei = 0;
    req.forEach((scene,i)=>{
      merged.push(scene);
      if(evs.length>0 && (i+1)%gap===0 && ei<evs.length){
        merged.push(evs[ei]); ei++;
      }
    });
    while(ei<evs.length){ merged.push(evs[ei]); ei++; }
    timeline.push(...merged);
  });
  return timeline;
}

let state = null; // {timeline, index, log:[], phase:'scene'|'result'|'end', lastChoice:null}

function saveState(){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      timelineIds: state.timeline.map(s=>s.id),
      timelineData: state.timeline,
      index: state.index,
      log: state.log
    }));
  }catch(e){ /* 保存できなくてもゲームは続行 */ }
}
function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  }catch(e){ return null; }
}
function clearSave(){
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
}

function startNewGame(){
  state = { timeline: buildTimeline(), index:0, log:[], phase:"scene" };
  saveState();
  render();
}
function resumeGame(){
  const s = loadSave();
  if(!s){ startNewGame(); return; }
  state = { timeline: s.timelineData, index: s.index, log: s.log, phase:"scene" };
  render();
}

function currentScene(){ return state.timeline[state.index]; }

function chooseOption(choiceIndex){
  const scene = currentScene();
  const choice = scene.choices[choiceIndex];
  state.log.push({
    stage: scene.stage,
    title: scene.title || scene.eventName,
    kind: scene.kind,
    choiceText: choice.text,
    result: choice.result
  });
  state.lastChoice = choice;
  state.phase = "result";
  saveState();
  render();
}

function goNext(){
  state.index++;
  if(state.index >= state.timeline.length){
    state.phase = "end";
    clearSave();
  }else{
    state.phase = "scene";
  }
  saveState();
  render();
}

/* =========================================================

   ========================================================= */
const app = document.getElementById("app");

function render(){
  app.innerHTML = "";
  if(!state){ renderTitle(); return; }
  if(state.phase==="end"){ renderEnding(); return; }

  const scene = currentScene();
  const stageInfo = STAGES[scene.stage];

  // ステージバー
  const bar = document.createElement("div");
  bar.className = "stagebar";
  bar.style.setProperty("--stage-color", stageInfo.color);
  bar.style.background = stageInfo.color;
  const stageIdx = STAGE_ORDER.indexOf(scene.stage);
  bar.innerHTML = `
    <div class="row">
      <div class="season">${stageInfo.label}</div>
      <div class="month">米づくりゲームブック</div>
    </div>
    <div class="dots">
      ${STAGE_ORDER.map((k,i)=>`<div class="dot ${i<stageIdx?"done":""} ${i===stageIdx?"now":""}"></div>`).join("")}
    </div>`;
  app.appendChild(bar);

  const main = document.createElement("main");

  if(state.phase==="scene"){
    const card = document.createElement("div");
    card.className = "scene-card";
    card.innerHTML = `
      <p class="scene-title">${scene.kind==="event" ? "できごと：" + scene.eventName : scene.title}</p>
      <p class="scene-text">${scene.text}</p>`;
    main.appendChild(card);

    const choices = document.createElement("div");
    choices.className = "choices";
    scene.choices.forEach((c,i)=>{
      const btn = document.createElement("button");
      btn.className = "choice-btn";
      btn.innerHTML = `<span class="num">${i+1}</span>${c.text}`;
      btn.onclick = ()=>chooseOption(i);
      choices.appendChild(btn);
    });
    main.appendChild(choices);
  }

  if(state.phase==="result"){
    const c = state.lastChoice;
    const card = document.createElement("div");
    card.className = "result-card";
    card.innerHTML = `
      <div class="result-block">
        <h3>結果</h3>
        <p>${c.result}</p>
      </div>
      <div class="point-block">
        <h3>ここがポイント</h3>
        <p>${c.point}</p>
      </div>
      ${c.fact ? `<div class="fact-block"><p>${c.fact}</p></div>` : ""}
    `;
    main.appendChild(card);

    const nextBtn = document.createElement("button");
    nextBtn.className = "next-btn";
    nextBtn.textContent = "つぎへ";
    nextBtn.onclick = goNext;
    main.appendChild(nextBtn);
  }

  app.appendChild(main);
}

    list.appendChild(div);

  logCard.appendChild(list);

  const learnCard = document.createElement("div");

  learnCard.innerHTML = `<p class="scene-title">今回、体験した学習ポイント</p>`;
  const grid = document.createElement("div");

  Object.values(REQUIRED_LEARNING).forEach(label=>{
    const chip = document.createElement("span");
    chip.className = "learn-chip";

    grid.appendChild(chip);

  learnCard.appendChild(grid);

    <p class="reflect-q">一番迷った選択は、どれでしたか？　なぜその方法を選びましたか？</p>
    <textarea class="reflect" placeholder="ここに書いて、学びノートに続きを書こう。"></textarea>
  `;
  main.appendChild(reflectCard);

  const retryBtn = document.createElement("button");
  retryBtn.className = "next-btn";
  retryBtn.textContent = "もう一度あそぶ（べつの一年へ）";

  footer.className = "note";
